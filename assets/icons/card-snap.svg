<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="csi-t csi-d">
  <title id="csi-t">Card Snap app icon</title>
  <desc id="csi-d">White business card with a person and an envelope cut out, on a diagonal gradient from brand blue #008BFF to black. Vector redraw of frontend/assets/images/ios-marketing-icon.png.</desc>
  <defs>
    <linearGradient id="csi-grad" gradientUnits="userSpaceOnUse" x1="159" y1="-280" x2="-349" y2="613">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="1" stop-color="#008BFF"/>
    </linearGradient>
    <mask id="csi-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect x="185" y="267" width="653" height="489" rx="52" fill="#FFFFFF"/>
      <circle cx="403" cy="429.5" r="82" fill="#000000"/>
      <path d="M239 675V646C239 598 318 564 403 564C488 564 566 598 566 646V675Z" fill="#000000"/>
      <rect x="567" y="348" width="217" height="163" rx="12" fill="#000000"/>
      <path d="M594 389L676 441L758 389" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linejoin="round"/>
    </mask>
    <filter id="csi-lift" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g transform="scale(0.5)">
      <rect width="1024" height="1024" fill="url(#csi-grad)"/>
      <g filter="url(#csi-lift)"><rect x="185" y="267" width="653" height="489" fill="#FFFCFC" mask="url(#csi-cut)"/></g>
  </g>
</svg>
