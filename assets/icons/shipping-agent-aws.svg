<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="ic-t ic-d">
  <title id="ic-t">Shipping Agent Assistant icon</title>
  <desc id="ic-d">A white chat bubble holding an isometric parcel with a tape band, on the app's indigo-to-purple gradient (#667eea to #764ba2).</desc>
  <defs>
    <linearGradient id="ic-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#667EEA"/>
      <stop offset="1" stop-color="#764BA2"/>
    </linearGradient>
    <radialGradient id="ic-hi" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(150 90) scale(360 300)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="ic-soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <clipPath id="ic-tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#ic-tile)">
    <rect width="512" height="512" fill="url(#ic-bg)"/>
    <rect width="512" height="512" fill="url(#ic-hi)"/>
    <path d="M112 1.5H400" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>
  </g>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- Mark: chat bubble + parcel (512 grid) -->
  <path d="M168 112H344A72 72 0 0 1 416 184V288A72 72 0 0 1 344 360H216L132 418L150 357A72 72 0 0 1 96 288V184A72 72 0 0 1 168 112Z" fill="#2B1F66" fill-opacity="0.35" transform="translate(0 14)" filter="url(#ic-soft)"/>
  <path d="M168 112H344A72 72 0 0 1 416 184V288A72 72 0 0 1 344 360H216L132 418L150 357A72 72 0 0 1 96 288V184A72 72 0 0 1 168 112Z" fill="#FFFFFF"/>
  <path d="M256 152L340 194L256 236L172 194Z" fill="#8C9BF3"/>
  <path d="M172 194L256 236V332L172 290Z" fill="#667EEA"/>
  <path d="M256 236L340 194V290L256 332Z" fill="#764BA2"/>
  <path d="M201.5 179.3L226.5 166.7L310.5 208.7L285.5 221.3Z" fill="#D6DCFC"/>
  <path d="M285.5 221.3L310.5 208.7V304.7L285.5 317.3Z" fill="#A487CC"/>
</svg>
